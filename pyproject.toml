[project]
name = "scbasket"
version = "0.1.0"
description = "Shot-value-weighted space control model built on SkillCorner's basketball open data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scbasket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: requires the real dataset to be downloaded"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
