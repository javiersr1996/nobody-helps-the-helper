[project]
name = "scbasket"
version = "0.1.0"
description = "Nobody helps the helper: who covers the man the helper leaves, measured against a placebo, from SkillCorner basketball tracking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# F1b only: the gradient boosting that grades the forward label. Never a core dependency;
# scbasket itself stays numpy and pandas, so the package still installs and runs without it.
forward = ["scikit-learn>=1.4"]
# P7.4 only: the two figures. Same rule as above, the package draws nothing by itself
# and every number behind a figure is in a reports/*.csv that needs no plotting library.
figures = ["matplotlib>=3.8"]
# B5 only: drives the built wind page in headless Chromium (scripts/drive_wind_page.py).
# Same rule as above, the page and the package need none of it; after installing run
# `playwright install chromium` once.
page = ["playwright>=1.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scbasket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: requires the real dataset to be downloaded"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The driver embeds JavaScript snippets and one-line check names; wrapping them costs clarity.
"scripts/drive_wind_page.py" = ["E501"]
