[project]
name = "scbasket"
version = "0.1.0"
description = "Ingesta, estandarizacion y perfil de calidad del open data de baloncesto de SkillCorner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scbasket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
