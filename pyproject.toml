[project]
name = "scbasket"
version = "0.1.0"
description = "Shot-value-weighted space control model built on SkillCorner's basketball open data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# F1b only: the gradient boosting that grades the forward label. Never a core dependency;
# scbasket itself stays numpy and pandas, so the package still installs and runs without it.
forward = ["scikit-learn>=1.4"]
# P7.4 only: the two figures. Same rule as above, the package draws nothing by itself
# and every number behind a figure is in a reports/*.csv that needs no plotting library.
figures = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scbasket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: requires the real dataset to be downloaded"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
